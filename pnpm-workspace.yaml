packages:
  - "packages/*"
# Dependencies allowed to run install scripts. pnpm 12 fails the install
# (ERR_PNPM_IGNORED_BUILDS) for any dependency with a script not listed here.
allowBuilds:
  # Native module, used by db:migrate and the Electron auth store.
  better-sqlite3: true
  # Fetches the Prisma query and schema engines.
  '@prisma/engines': true
  # Downloads the Electron binary for the desktop shell (electron-dev/pack).
  electron: true
  # Checks and installs the platform esbuild binary that Vite uses.
  esbuild: true
  # The prisma CLI postinstall is not needed: engines come from
  # @prisma/engines and client generation runs as an explicit script.
  prisma: false
