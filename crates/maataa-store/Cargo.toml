[package]
name = "maataa-store"
version = "0.1.0"
edition = "2021"
description = "Power-safe key-value log over two flash banks for Maataa OS"
license = "UNLICENSED"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# RustCrypto, pure Rust, no_std, no allocation: records are sealed with
# ChaCha20-Poly1305.
chacha20poly1305 = { version = "0.10", default-features = false }
