[package]
name = "maataa-wasm"
version = "0.1.0"
edition = "2021"
description = "Small no_std WebAssembly interpreter for Maataa OS capsules (i32 subset, no linear memory)"
license = "UNLICENSED"
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
# Tests assemble their modules from text.
wat = "1"
# Reference interpreter for the differential test.
wasmi = "0.40"
