name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  kernel:
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-arm binutils-arm-none-eabi ripgrep
      # Toolchain, targets and rust-src come from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      # The docs must still say what the code does (version, smoke checks,
      # SVC ABI); the size table is checked again after the size check.
      - name: Docs match the code
        run: ./scripts/check-docs.py
      - name: Lint host crates
        run: cargo clippy -p maataa-store -p maataa-capsule -p maataa-wasm -p maataa-link -p hemant-core -p maataa-sandhi --all-targets --all-features -- -D warnings
      - name: Lint the kernel for each board and test build
        run: |
          cargo clippy --target thumbv7em-none-eabihf -- -D warnings
          cargo clippy --target thumbv7em-none-eabihf --features kernel-stack-test -- -D warnings
          cargo clippy --target thumbv7em-none-eabihf --no-default-features --features board-f411 -- -D warnings
          cargo clippy --target thumbv7em-none-eabihf --no-default-features --features board-f411,watchdog-test -- -D warnings
          cargo clippy --target thumbv7em-none-eabihf --features otp-rollback -- -D warnings
          cargo clippy --target thumbv7em-none-eabihf --no-default-features --features board-f411,otp-rollback -- -D warnings
          cargo clippy --target thumbv7em-none-eabihf --features inversion-test -- -D warnings
          cargo clippy --target thumbv7em-none-eabihf --features inversion-test,pi-off -- -D warnings
      # Both board builds, F411 has no semihosting, host tests, QEMU boot
      # report and task order, and the clock self-test under -icount.
      - run: ./scripts/smoke-alpha.sh
      - run: set -o pipefail; ./scripts/sizecheck.sh | tee target/sizecheck.txt
      - name: Size table matches the build
        run: ./scripts/check-docs.py --sizes target/sizecheck.txt
