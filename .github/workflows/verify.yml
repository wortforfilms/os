name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  kernel:
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-arm binutils-arm-none-eabi ripgrep
      # Toolchain, targets and rust-src come from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # Both board builds, F411 has no semihosting, host tests, QEMU boot
      # report and task order, and the clock self-test under -icount.
      - run: ./scripts/smoke-alpha.sh
      - run: ./scripts/sizecheck.sh
