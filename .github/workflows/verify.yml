name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version from package.json "packageManager" (pnpm 11+ reads allowBuilds).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-arm binutils-arm-none-eabi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:migrate
      - run: pnpm run seed
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run evidence:generate
      - run: pnpm run smoke
      - run: pnpm run audit:phkd
