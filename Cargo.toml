[package]
name = "maataa-os"
version = "0.1.0-alpha.1"
edition = "2021"
autobins = false
autoexamples = false

[workspace]
members = [".", "crates/hemant-core"]
resolver = "2"

[features]
# Exactly one board. The default keeps `cargo build` and the QEMU scripts as they were.
default = ["board-qemu-f405"]
board-qemu-f405 = ["dep:cortex-m-semihosting"]
board-f411 = ["dep:stm32f4xx-hal"]

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
panic-halt = "0.2.0"
rtt-target = { version = "0.3.1", features = ["cortex-m"] }
embassy-executor = { version = "0.5.0", features = ["arch-cortex-m", "executor-thread", "integrated-timers"] }
embassy-time = "0.3.0"

# QEMU output and host-clock calls; deliberately absent from the F411 feature tree.
cortex-m-semihosting = { version = "0.5.0", optional = true }
# Hemant time primitives; the kernel clock feeds MonotonicTick (src/clock.rs).
hemant-core = { path = "crates/hemant-core" }
# Clock tree on real STM32F411 boards (src/board.rs); not linked for QEMU.
stm32f4xx-hal = { version = "0.23.0", features = ["stm32f411"], optional = true }

[[bin]]
name = "maataa-os"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "clock_selftest"
path = "src/bin/clock_selftest.rs"
test = false
bench = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
