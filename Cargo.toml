[package]
name = "maataa-os"
version = "0.1.0-alpha.5"
edition = "2021"
autobins = false
autoexamples = false

[workspace]
members = [".", "crates/hemant-core", "crates/maataa-link", "crates/maataa-capsule", "crates/maataa-wasm", "crates/maataa-store", "crates/maataa-sandhi"]
resolver = "2"

[features]
# Exactly one board. The default keeps `cargo build` and the QEMU scripts as they were.
default = ["board-qemu-f405"]
board-qemu-f405 = ["dep:cortex-m-semihosting"]
board-f411 = ["dep:stm32f4xx-hal"]
# F411 only: idle with WFI (low power). The default NOP path keeps the debug
# probe attached while USART2 remains available for serial output.
low-power = []
# Test only: task 2 asks the kernel (svc #4) to recurse on the main stack until
# it hits the kernel stack guard. The system must report and stop.
kernel-stack-test = []
# Test only (F411): task 2 asks the kernel to hang with interrupts off, so the
# watchdog must reset the board. After a watchdog reset the kernel refuses to
# hang again and reports the reset cause instead.
watchdog-test = []
# Test only: the clock self-test runs under QEMU -icount, where guest time
# follows the instruction count, not host time. The host-rate check is then
# reported, not asserted (scripts/qemu-clock-test.sh).
qemu-icount = []
# Rollback protection for the persistent store: a counter in one-time
# programmable memory (crates/maataa-store/src/rollback.rs). On the F411 it
# writes the OTP area (0x1FFF7900..0x1FFF79FF), which can NEVER be erased:
# each store compaction uses up one of its 256 bytes for good. In QEMU the
# "OTP" is the host file target/qemu-otp.bin. Off by default.
otp-rollback = []
# Test only: tasks 1-3 act out a priority inversion (low holds a lock, high
# waits, middle computes); scripts/qemu-inversion-test.sh runs it with and
# without `pi-off`.
inversion-test = []
# Turns priority inheritance off, for the comparison run above. Never ship it.
pi-off = []

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
panic-halt = "0.2.0"

# QEMU output and host-clock calls; deliberately absent from the F411 feature tree.
cortex-m-semihosting = { version = "0.5.0", optional = true }
# Hemant time primitives; the kernel clock feeds MonotonicTick (src/clock.rs).
hemant-core = { path = "crates/hemant-core" }
# Host channel codec, shared with the host tool (src/hostlink.rs).
maataa-link = { path = "crates/maataa-link" }
# Signed capsule images and capability bits (src/capsule/mod.rs, src/syscall.rs).
maataa-capsule = { path = "crates/maataa-capsule" }
# WebAssembly interpreter for capsule payloads (src/capsule_task.rs).
maataa-wasm = { path = "crates/maataa-wasm" }
# Power-safe key-value store on two flash banks (src/storage/persist.rs).
maataa-store = { path = "crates/maataa-store" }
# Clock tree on real STM32F411 boards (src/board.rs); not linked for QEMU.
stm32f4xx-hal = { version = "0.23.0", features = ["stm32f411"], optional = true }

# Embedded-only. Nothing compiled uses them yet (only src/utils.rs and
# src/capsule/api.rs, which are not in the module tree), and
# embassy-executor's cortex-m arch does not build for the host, so host
# `cargo test --lib` on x86_64 (CI) needs them out of the host graph.
[target.'cfg(target_arch = "arm")'.dependencies]
embassy-executor = { version = "0.5.0", features = ["arch-cortex-m", "executor-thread", "integrated-timers"] }
embassy-time = "0.3.0"

[dev-dependencies]
# Host tests sign their own capsule images (src/installed.rs).
maataa-capsule = { path = "crates/maataa-capsule", features = ["cli"] }
# The panini capsule is checked against its reference (src/capsule_task.rs).
maataa-sandhi = { path = "crates/maataa-sandhi" }

[[bin]]
name = "maataa-os"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "clock_selftest"
path = "src/bin/clock_selftest.rs"
test = false
bench = false

# Debug builds must also fit the 128 KiB kernel flash region (memory.x keeps
# sector 5 for the run-time capsule area and sectors 6-7 for the persistent
# store), so they are size-optimised too. Overflow checks stay on; debug
# assertions (core's extra checks and their messages) are off to fit.
[profile.dev]
opt-level = "z"
lto = true
codegen-units = 1
debug-assertions = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
